<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Realizar Pedido</title>
    <link rel="stylesheet" href="style.css?v=1.6">
	<div id="manager-notice" style="display: none;"></div>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="header-wrapper">
        <img id="app-logo" src="" alt="logo">
        <div id="app-header"></div>
    </div>
    <div id="app-subheader"></div>
    <div id="fixed-notice"></div>
    
    <div id="goods-list">
        <div class="loader-container">
            <div class="spinner"></div>
        </div>
    </div>
    
    <div id="app-footer"></div>

    <div id="help-container">
        <button class="help-icon-btn" onclick="toggleHelp()">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
        </button>
        <div id="help-text"></div>
    </div>

    
    <div id="send-btn" class="main-button" onclick="sendOrder()">CONFIRMAR PEDIDO</div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let serverData = null;
        const urlParams = new URLSearchParams(window.location.search);
        let currentAction = urlParams.get('mode') || 'new';
		let currentType = urlParams.get('type') || 'order'; 
        let order = {};
		
		function applyTheme() {
            if (!serverData) return;
            const isDark = tg.colorScheme === 'dark';
            const bgColor = isDark ? (serverData.bg_color_dark || serverData.bg_color) : serverData.bg_color;
            const textColor = isDark ? (serverData.text_color_dark || serverData.text_color) : serverData.text_color;

            if (bgColor) {
                document.documentElement.style.setProperty('--app-bg-color', bgColor);
            }
            if (textColor) {
                document.documentElement.style.setProperty('--main-text-color', textColor);
            }
        }

        tg.onEvent('themeChanged', applyTheme);

        async function loadGoods() {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 15000);

            try {
                const urlParams = new URLSearchParams(window.location.search);
                let userId = urlParams.get('tg_id') || (tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : '');
                
                // Передаем tg_id, mode и type бэкенду
                const response = await fetch(`https://melts.sigmaboy.us/api/goods?tg_id=${userId}&mode=${currentAction}&type=${currentType}&v=${Date.now()}`, { 
                    signal: controller.signal 
                });
				                
                clearTimeout(timeoutId);
                serverData = await response.json();
				
				applyTheme();
                
                // Применяем цвет главной кнопки
                if (serverData.confirm_btn_color) {
                    document.getElementById('send-btn').style.backgroundColor = serverData.confirm_btn_color;
                }

                // Отображаем общие тексты
                if (serverData.texts.logo) {
                    const logoEl = document.getElementById('app-logo');
                    logoEl.src = serverData.texts.logo;
                    logoEl.style.display = 'block';
                }
				
				const data = serverData;
                
                // Отображаем общие тексты
                if (serverData.texts.logo) {
                    const logoEl = document.getElementById('app-logo');
                    logoEl.src = serverData.texts.logo;
                    logoEl.style.display = 'block';
                }
                if (serverData.texts.help) {
                    const helpEl = document.getElementById('help-text');
                    document.getElementById('help-container').style.display = 'block';
                    helpEl.innerHTML = serverData.texts.help;
                    
                    // Перехват кликов по ссылкам для открытия во внешнем браузере устройства
                    helpEl.addEventListener('click', (e) => {
                        const link = e.target.closest('a');
                        if (link && link.href) {
                            e.preventDefault();
                            tg.openLink(link.href);
                        }
                    });
                }
                if (serverData.texts.footer) document.getElementById('app-footer').innerText = serverData.texts.footer;

                // Отображение баннера менеджера
                if (serverData.manager_name) {
                    const mNotice = document.getElementById('manager-notice');
                    const opName = currentType === 'stock' ? 'inventario' : 'pedido';
                    mNotice.innerHTML = `✍️ <b>Modo Representante</b><br>` +
                                        `<b>${serverData.manager_name}</b> tramitando ${opName}<br>` +
                                        `para <b>${serverData.company_name}</b>`;
                    mNotice.style.display = 'block';
                }

                // Логика блокировки или отображения формы
                if (serverData.is_fixed) {
                    const notice = document.getElementById('fixed-notice');
                    notice.innerText = serverData.texts.fixed_msg || 'El pedido está bloqueado.';
                    notice.style.display = 'block';
                    document.getElementById('goods-list').style.display = 'none';
                    document.getElementById('send-btn').style.display = 'none';
                    document.getElementById('app-subheader').style.display = 'none';
                } else {
                    // Устанавливаем заголовки и кнопку напрямую из ответа сервера
                    document.getElementById('app-header').innerText = serverData.texts.header;
                    document.getElementById('send-btn').innerText = serverData.texts.confirm_btn;
                    document.getElementById('app-subheader').innerText = serverData.texts.subheader;

                    renderGoods(serverData.goods, serverData.saved_selection || {});
                }

              

            } catch (e) {
                document.getElementById('goods-list').innerHTML = `
                    <div class="error-container">
                        <p>No se pudo cargar la lista de productos.</p>
                        <button class="retry-btn" onclick="location.reload()">REINTENTAR</button>
                    </div>
                `;
            }
        }

 
        function renderGoods(items, saved) {
            const container = document.getElementById('goods-list');
            container.innerHTML = '';
            
            items.forEach(item => {
                let initialQty = saved[item.Title] || 0;
                if (initialQty > 0) order[item.ID] = initialQty;

                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `
                    <span>${item.Title}${item.Unit ? ` (${item.Unit})` : ''}</span>
                    <div class="controls">
                        <button style="background-color: ${serverData.btn_color || ''}" onclick="change(${item.ID}, -1)">-</button>
                        <input type="number" id="qty-${item.ID}" value="${initialQty}" oninput="updateManual(${item.ID}, this.value)">
                        <button style="background-color: ${serverData.btn_color || ''}" onclick="change(${item.ID}, 1)">+</button>
                    </div>
                `;
                container.appendChild(div);
            });

            const hasItems = Object.keys(order).length > 0;
            document.getElementById('send-btn').style.display = (hasItems || currentAction === 'update') ? 'block' : 'none';
        }

        function change(id, delta) {
            let input = document.getElementById(`qty-${id}`);
            let val = (parseInt(input.value) || 0) + delta;
            
            // Ограничения
            if (val < 0) val = 0;
            if (val > 99) val = 99; 
            
            input.value = val;
            updateManual(id, val);
        }

        function updateManual(id, value) {
            let input = document.getElementById(`qty-${id}`);
            let cleanValue = value.toString().replace(/[^0-9]/g, ''); // Удаляем всё, кроме цифр
            
            // Проверка регулярным выражением из настроек
            let regex = new RegExp(serverData.qty_regex || "^[0-9]{1,2}$");
            
            if (cleanValue !== "" && !regex.test(cleanValue)) {
                // Если ввели например 100, а разрешено 2 знака - обрезаем до 99
                cleanValue = 99;
            }

            let val = parseInt(cleanValue) || 0;
            input.value = val; // Визуально обновляем поле

            if (val > 0) order[id] = val;
            else delete order[id];

            const hasItems = Object.keys(order).length > 0;
            document.getElementById('send-btn').style.display = (hasItems || currentAction === 'update') ? 'block' : 'none';
        }

        function toggleHelp() {
            const helpBlock = document.getElementById('help-text');
            helpBlock.classList.toggle('open');
        }
        
        function updateOnlineStatus() {
            const btn = document.getElementById('send-btn');
            if (navigator.onLine) {
                btn.classList.remove('offline');
                // Возвращаем текст из конфига (или дефолтный)
                loadGoods(); // Перезагружаем, чтобы обновить текст кнопки, если он стерся
            } else {
                btn.classList.add('offline');
                btn.innerText = "SIN CONEXIÓN";
            }
        }

        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);

        // Обновлять данные, когда пользователь возвращается в приложение (например, разворачивает Telegram)
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === 'visible') {
                loadGoods();
            }
        });

        async function sendOrder() {
            const btn = document.getElementById('send-btn');
            
            // 1. Быстрая проверка через navigator
            if (!navigator.onLine) {
                tg.showAlert("No hay conexión a Internet. Por favor, compruebe su red.");
                return;
            }

            // 2. Активная проверка связи с сервером (Пинг)
            btn.innerText = "...";
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 3000); // Таймаут 3 сек
                const ping = await fetch('https://melts.sigmaboy.us/health-check', { signal: controller.signal });
                clearTimeout(timeoutId);
                
                if (ping.ok) {
                    tg.sendData(JSON.stringify({
                        items: order,
                        action: currentAction,
						type: currentType
                    }));
                    tg.close();
                } else {
                    throw new Error();
                }
            } catch (e) {
                tg.showAlert("El servidor no responde. Por favor, inténtelo de nuevo en un minuto.");
                updateOnlineStatus(); // Возвращаем текст кнопки
            }
        }

        loadGoods();
    </script>
</body>
</html>
