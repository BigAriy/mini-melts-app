<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Realizar Pedido</title>
    <link rel="stylesheet" href="style.css?v=1.9">
	<div id="manager-notice" style="display: none;"></div>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="header-wrapper">
        <img id="app-logo" src="" alt="logo">
        <div id="app-header"></div>
    </div>
    <div id="app-subheader"></div>
    <div id="fixed-notice"></div>
    
    <div id="goods-list">
        <div class="loader-container">
            <div class="spinner"></div>
        </div>
    </div>
    
    <div id="app-footer"></div>

    <div id="help-container">
        <button class="help-icon-btn" onclick="toggleHelp()">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
        </button>
        <div id="help-text"></div>
    </div>
	
	<div id="theme-container" style="text-align: center; margin-top: 10px; margin-bottom: 20px;">
        <button id="theme-toggle-btn" class="help-icon-btn">
            <span id="theme-icon-sun" style="font-size: 28px; line-height: 1;">🌞</span>
            <span id="theme-icon-moon" style="font-size: 28px; line-height: 1; display: none;">🌛</span>
        </button>
    </div>

    
    <div id="send-btn" class="main-button" onclick="sendOrder()">CONFIRMAR PEDIDO</div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let serverData = null;
        const urlParams = new URLSearchParams(window.location.search);
        let currentAction = urlParams.get('mode') || 'new';
		let currentType = urlParams.get('type') || 'order'; 
        let order = {};
		
		let manualThemeOverride = null;

        function toggleThemeManual() {
            try {
                const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                const tgDark = tg.colorScheme === 'dark';
                const autoDark = tgDark || systemDark;
                const currentDark = manualThemeOverride !== null ? manualThemeOverride : autoDark;
                manualThemeOverride = !currentDark;
                applyTheme();

            } catch (err) {
                alert("Theme Error: " + err.message);
            }
        }
        window.toggleThemeManual = toggleThemeManual;

        function applyTheme() {
            try {
                const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                const tgDark = tg.colorScheme === 'dark';
                const autoDark = tgDark || systemDark;
                const isDark = manualThemeOverride !== null ? manualThemeOverride : autoDark;

                const sunIcon = document.getElementById('theme-icon-sun');
                const moonIcon = document.getElementById('theme-icon-moon');
                if (sunIcon && moonIcon) {
                    if (isDark) {
                        sunIcon.style.display = 'none';
                        moonIcon.style.display = 'inline-block';
                    } else {
                        sunIcon.style.display = 'inline-block';
                        moonIcon.style.display = 'none';
                    }
                }

                if (!serverData) return;

                const darkBgFallback = currentType === 'stock' ? '#121213' : '#1c1c1d';
                const bgColor = isDark 
                    ? (serverData.bg_color_dark && serverData.bg_color_dark.trim() !== "" ? serverData.bg_color_dark : darkBgFallback)
                    : serverData.bg_color;

                const textColor = isDark 
                ? (serverData.text_color_dark && serverData.text_color_dark.trim() !== "" ? serverData.text_color_dark : '#ffffff')
                : (serverData.text_color && serverData.text_color.trim() !== "" ? serverData.text_color : '#333333');

            const iconColor = isDark
                ? (serverData.icon_color_dark && serverData.icon_color_dark.trim() !== "" ? serverData.icon_color_dark : textColor)
                : (serverData.icon_color && serverData.icon_color.trim() !== "" ? serverData.icon_color : textColor);

            if (bgColor) {
                document.documentElement.style.setProperty('--app-bg-color', bgColor);
                document.body.style.setProperty('--app-bg-color', bgColor);
                document.body.style.backgroundColor = bgColor;
            }
            if (textColor) {
                document.documentElement.style.setProperty('--main-text-color', textColor);
                document.documentElement.style.setProperty('--tg-theme-text-color', textColor);
                document.documentElement.style.setProperty('--header-color', textColor);
                document.body.style.setProperty('--main-text-color', textColor);
                document.body.style.setProperty('--tg-theme-text-color', textColor);
                document.body.style.setProperty('--header-color', textColor);
                document.body.style.color = textColor;
            }
            if (iconColor) {
                document.documentElement.style.setProperty('--icon-color', iconColor);
                document.body.style.setProperty('--icon-color', iconColor);
            }
            } catch (e) {
                console.error("applyTheme error:", e);
            }
        }

        tg.onEvent('themeChanged', applyTheme);
        if (window.matchMedia) {
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const themeBtn = document.getElementById('theme-toggle-btn');
            if (themeBtn) {
                themeBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    toggleThemeManual();
                });
            }
        });
		
        async function loadGoods() {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 15000);

            try {
                const urlParams = new URLSearchParams(window.location.search);
                let userId = urlParams.get('tg_id') || (tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : '');
                
                // Передаем tg_id, mode и type бэкенду
                const response = await fetch(`https://melts.sigmaboy.us/api/goods?tg_id=${userId}&mode=${currentAction}&type=${currentType}&v=${Date.now()}`, { 
                    signal: controller.signal 
                });
				                
                clearTimeout(timeoutId);
                serverData = await response.json();
				
				applyTheme();
                
                // Применяем цвет главной кнопки
                if (serverData.confirm_btn_color) {
                    document.getElementById('send-btn').style.backgroundColor = serverData.confirm_btn_color;
                }

                // Отображаем общие тексты
                if (serverData.texts.logo) {
                    const logoEl = document.getElementById('app-logo');
                    logoEl.src = serverData.texts.logo;
                    logoEl.style.display = 'block';
                }
				
				const data = serverData;
                
                // Отображаем общие тексты
                if (serverData.texts.logo) {
                    const logoEl = document.getElementById('app-logo');
                    logoEl.src = serverData.texts.logo;
                    logoEl.style.display = 'block';
                }
                if (serverData.texts.help) {
                    const helpEl = document.getElementById('help-text');
                    document.getElementById('help-container').style.display = 'block';
                    helpEl.innerHTML = serverData.texts.help;
                    
                    // Перехват кликов по ссылкам для открытия во внешнем браузере устройства
                    helpEl.addEventListener('click', (e) => {
                        const link = e.target.closest('a');
                        if (link && link.href) {
                            e.preventDefault();
                            tg.openLink(link.href);
                        }
                    });
                }
                if (serverData.texts.footer) document.getElementById('app-footer').innerText = serverData.texts.footer;

                // Отображение баннера менеджера
                if (serverData.manager_name) {
                    const mNotice = document.getElementById('manager-notice');
                    const opName = currentType === 'stock' ? 'inventario' : 'pedido';
                    mNotice.innerHTML = `✍️ <b>Modo Representante</b><br>` +
                                        `<b>${serverData.manager_name}</b> tramitando ${opName}<br>` +
                                        `para <b>${serverData.company_name}</b>`;
                    mNotice.style.display = 'block';
                }

                // Логика блокировки или отображения формы
                if (serverData.is_fixed) {
                    const notice = document.getElementById('fixed-notice');
                    notice.innerText = serverData.texts.fixed_msg || 'El pedido está bloqueado.';
                    notice.style.display = 'block';
                    document.getElementById('goods-list').style.display = 'none';
                    document.getElementById('send-btn').style.display = 'none';
                    document.getElementById('app-subheader').style.display = 'none';
                } else {
                    // Устанавливаем заголовки и кнопку напрямую из ответа сервера
                    document.getElementById('app-header').innerText = serverData.texts.header;
                    document.getElementById('send-btn').innerText = serverData.texts.confirm_btn;
                    document.getElementById('app-subheader').innerText = serverData.texts.subheader;

                    renderGoods(serverData.goods, serverData.saved_selection || {});
                }

              

            } catch (e) {
                document.getElementById('goods-list').innerHTML = `
                    <div class="error-container">
                        <p>No se pudo cargar la lista de productos.</p>
                        <button class="retry-btn" onclick="location.reload()">REINTENTAR</button>
                    </div>
                `;
            }
        }

 
        function renderGoods(items, saved) {
            const container = document.getElementById('goods-list');
            container.innerHTML = '';
            
            items.forEach(item => {
                let initialQty = saved[item.Title] || 0;
                if (initialQty > 0) order[item.ID] = initialQty;

                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `
                    <span>${item.Title}${item.Unit ? ` (${item.Unit})` : ''}</span>
                    <div class="controls">
                        <button style="background-color: ${serverData.btn_color || ''}" onclick="change(${item.ID}, -1)">-</button>
                        <input type="number" id="qty-${item.ID}" value="${initialQty}" oninput="updateManual(${item.ID}, this.value)">
                        <button style="background-color: ${serverData.btn_color || ''}" onclick="change(${item.ID}, 1)">+</button>
                    </div>
                `;
                container.appendChild(div);
            });

            const hasItems = Object.keys(order).length > 0;
            document.getElementById('send-btn').style.display = (hasItems || currentAction === 'update') ? 'block' : 'none';
        }

        function getMaxQty() {
            if (!serverData || !serverData.qty_regex) return 999;
            const match = serverData.qty_regex.match(/\{[0-9]+,([0-9]+)\}/);
            if (match && match[1]) {
                const digits = parseInt(match[1]);
                return Math.pow(10, digits) - 1;
            }
            return 999;
        }

        function change(id, delta) {
            let input = document.getElementById(`qty-${id}`);
            let val = (parseInt(input.value) || 0) + delta;
            
            let maxQty = getMaxQty();
            if (val < 0) val = 0;
            if (val > maxQty) val = maxQty; 
            
            input.value = val;
            updateManual(id, val);
        }

        function updateManual(id, value) {
            let input = document.getElementById(`qty-${id}`);
            let cleanValue = value.toString().replace(/[^0-9]/g, ''); // Удаляем всё, кроме цифр
            
            let maxQty = getMaxQty();
            let regex = new RegExp(serverData.qty_regex || "^[0-9]{1,3}$");
            
            if (cleanValue !== "" && !regex.test(cleanValue)) {
                cleanValue = maxQty;
            }

            let val = parseInt(cleanValue) || 0;
            input.value = val; // Визуально обновляем поле

            if (val > 0) order[id] = val;
            else delete order[id];

            const hasItems = Object.keys(order).length > 0;
            document.getElementById('send-btn').style.display = (hasItems || currentAction === 'update') ? 'block' : 'none';
        }

        function toggleHelp() {
            const helpBlock = document.getElementById('help-text');
            helpBlock.classList.toggle('open');
        }
        
        function updateOnlineStatus() {
            const btn = document.getElementById('send-btn');
            if (navigator.onLine) {
                btn.classList.remove('offline');
                // Возвращаем текст из конфига (или дефолтный)
                loadGoods(); // Перезагружаем, чтобы обновить текст кнопки, если он стерся
            } else {
                btn.classList.add('offline');
                btn.innerText = "SIN CONEXIÓN";
            }
        }

        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);

        // Обновлять данные, когда пользователь возвращается в приложение (например, разворачивает Telegram)
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === 'visible') {
                loadGoods();
            }
        });

        async function sendOrder() {
            const btn = document.getElementById('send-btn');
            
            // 1. Быстрая проверка через navigator
            if (!navigator.onLine) {
                tg.showAlert("No hay conexión a Internet. Por favor, compruebe su red.");
                return;
            }

            // 2. Активная проверка связи с сервером (Пинг)
            btn.innerText = "...";
            try {
                const phoneParam = urlParams.get('phone');
                if (phoneParam) {
                    const resp = await fetch('/api/order/submit', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            phone: phoneParam,
                            items: order,
                            action: currentAction,
                            type: currentType
                        })
                    });
                    if (resp.ok) {
                        alert("¡Pedido enviado con éxito!");
                    } else {
                        alert("Error al enviar el pedido.");
                    }
                    updateOnlineStatus();
                    return;
                }

                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 3000);
                const ping = await fetch('https://melts.sigmaboy.us/health-check', { signal: controller.signal });
                clearTimeout(timeoutId);
                
                if (ping.ok) {
                    tg.sendData(JSON.stringify({
                        items: order,
                        action: currentAction,
						type: currentType
                    }));
                    tg.close();
                } else {
                    throw new Error();
                }
            } catch (e) {
                if (tg.showAlert) {
                    tg.showAlert("El servidor no responde. Por favor, inténtelo de nuevo en un minuto.");
                } else {
                    alert("El servidor no responde. Por favor, inténtelo de nuevo en un minuto.");
                }
                updateOnlineStatus();
            }
        }

        loadGoods();
    </script>
</body>
</html>
