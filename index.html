<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Realizar Pedido</title>
    <link rel="stylesheet" href="style.css?v=1.4">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="app-header"></div>
    <div id="app-subheader"></div>
    
    <div id="goods-list">
        <div class="loader-container">
            <div class="spinner"></div>
        </div>
    </div>
    
    <div id="app-footer"></div>

    <div id="help-container">
        <button class="help-icon-btn" onclick="toggleHelp()">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
        </button>
        <div id="help-text"></div>
    </div>
    
    <div id="send-btn" class="main-button" onclick="sendOrder()">CONFIRMAR PEDIDO</div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // В реальном проекте здесь будет fetch к вашему API
        // Для теста покажем как бот передает товары
        let goods = []; 

        async function loadGoods() {
            // Создаем контроллер для прерывания запроса через 5 секунд
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 5000);

            try {
                const urlParams = new URLSearchParams(window.location.search);
                let userId = urlParams.get('tg_id') || (tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : '');
                
                const response = await fetch(`https://melts.sigmaboy.us/api/goods?tg_id=${userId}&v=${Date.now()}`, { 
                    signal: controller.signal 
                });
                
                clearTimeout(timeoutId); // Отменяем тайм-аут, если запрос успел
                const data = await response.json();
                
                // Отображаем тексты из настроек
                if (data.texts.header) document.getElementById('app-header').innerText = data.texts.header;
                if (data.texts.subheader) document.getElementById('app-subheader').innerText = data.texts.subheader;
                if (data.texts.footer) document.getElementById('app-footer').innerText = data.texts.footer;
                if (data.texts.confirm_btn) document.getElementById('send-btn').innerText = data.texts.confirm_btn;
                
                if (data.texts.help) {
                    document.getElementById('help-container').style.display = 'block';
                    document.getElementById('help-text').innerText = data.texts.help;
                }

                renderGoods(data.goods, data.saved_selection || {});
            } catch (e) {
                document.getElementById('goods-list').innerHTML = `
                    <div class="error-container">
                        <p>No se pudo cargar la lista de productos.</p>
                        <button class="retry-btn" onclick="location.reload()">REINTENTAR</button>
                    </div>
                `;
            }
        }

        let order = {};

        function renderGoods(items, saved) {
            const container = document.getElementById('goods-list');
            container.innerHTML = '';
            
            items.forEach(item => {
                // Проверяем, было ли сохранено количество для этого товара (по названию)
                let initialQty = saved[item.Title] || 0;
                if (initialQty > 0) order[item.ID] = initialQty;

                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `
                    <span>${item.Title}${item.Unit ? ` (${item.Unit})` : ''}</span>
                    <div class="controls">
                        <button onclick="change(${item.ID}, -1)">-</button>
                        <input type="number" id="qty-${item.ID}" value="${initialQty}" oninput="updateManual(${item.ID}, this.value)">
                        <button onclick="change(${item.ID}, 1)">+</button>
                    </div>
                `;
                container.appendChild(div);
            });

            // Если есть предзаполненные товары — сразу показываем кнопку подтверждения
            if (Object.keys(order).length > 0) {
                document.getElementById('send-btn').style.display = 'block';
            }
        }

        function change(id, delta) {
            let input = document.getElementById(`qty-${id}`);
            let val = parseInt(input.value) + delta;
            if (val < 0) val = 0;
            input.value = val;
            updateManual(id, val);
        }

        function updateManual(id, value) {
            let val = parseInt(value);
            if (isNaN(val) || val < 0) val = 0;
            
            if (val > 0) order[id] = val;
            else delete order[id];

            document.getElementById('send-btn').style.display = 
                Object.keys(order).length > 0 ? 'block' : 'none';
        }

        function toggleHelp() {
            const helpBlock = document.getElementById('help-text');
            helpBlock.classList.toggle('open');
        }
        
        function updateOnlineStatus() {
            const btn = document.getElementById('send-btn');
            if (navigator.onLine) {
                btn.classList.remove('offline');
                // Возвращаем текст из конфига (или дефолтный)
                loadGoods(); // Перезагружаем, чтобы обновить текст кнопки, если он стерся
            } else {
                btn.classList.add('offline');
                btn.innerText = "SIN CONEXIÓN";
            }
        }

        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);

        // Обновлять данные, когда пользователь возвращается в приложение (например, разворачивает Telegram)
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === 'visible') {
                loadGoods();
            }
        });

        async function sendOrder() {
            const btn = document.getElementById('send-btn');
            
            // 1. Быстрая проверка через navigator
            if (!navigator.onLine) {
                tg.showAlert("No hay conexión a Internet. Por favor, compruebe su red.");
                return;
            }

            // 2. Активная проверка связи с сервером (Пинг)
            btn.innerText = "...";
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 3000); // Таймаут 3 сек
                const ping = await fetch('https://melts.sigmaboy.us/health-check', { signal: controller.signal });
                clearTimeout(timeoutId);
                
                if (ping.ok) {
                    tg.sendData(JSON.stringify(order));
                    tg.close();
                } else {
                    throw new Error();
                }
            } catch (e) {
                tg.showAlert("El servidor no responde. Por favor, inténtelo de nuevo en un minuto.");
                updateOnlineStatus(); // Возвращаем текст кнопки
            }
        }

        loadGoods();
    </script>
</body>
</html>
